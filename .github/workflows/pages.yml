name: Deploy Physics Quest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    name: Verify and upload docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify the prebuilt PWA
        run: |
          test -s docs/index.html
          test -s docs/manifest.webmanifest
          test -s docs/sw.js
          grep -Fq 'id="game-card"' docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: docs

  deploy:
    name: Publish to GitHub Pages
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages
